name: Publish Scheduled Blog Posts

on:
  schedule:
    # Runs at 8:00 AM Eastern every day (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Publish due posts
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PUBLISHED=0

          # ----------------------------------------------------------------
          # Step 1: Add new feed.xml items for any post due today or earlier
          # Post files are named: YYYY-MM-DD-slug.html (not blog.html)
          # They're already live at their URLs — we only update feed.xml
          # ----------------------------------------------------------------
          for FILE in blog/_scheduled/*.html; do
            if [ ! -f "$FILE" ]; then continue; fi

            FILENAME=$(basename "$FILE")

            # Skip the blog index file
            if [ "$FILENAME" = "blog.html" ]; then continue; fi

            # Expect filename format: YYYY-MM-DD-slug.html
            POSTDATE=$(echo "$FILENAME" | cut -c1-10)

            # Validate it looks like a date
            if ! echo "$POSTDATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Skipping $FILENAME (no valid date prefix)"
              continue
            fi

            if [ "$POSTDATE" \<= "$TODAY" ]; then
              SLUG=$(echo "$FILENAME" | cut -c12-)
              echo "Adding feed item for $SLUG (scheduled $POSTDATE)"

              # Extract og: metadata from the post file
              TITLE=$(grep -o 'og:title" content="[^"]*"' "$FILE" | sed 's/og:title" content="//;s/"$//')
              DESCRIPTION=$(grep -o 'og:description" content="[^"]*"' "$FILE" | sed 's/og:description" content="//;s/"$//')
              IMAGE=$(grep -o 'og:image" content="[^"]*"' "$FILE" | sed 's/og:image" content="//;s/"$//')
              URL=$(grep -o 'og:url" content="[^"]*"' "$FILE" | sed 's/og:url" content="//;s/"$//')

              # Format the publish date for RSS (RFC 822)
              PUB_DATE=$(date -d "$POSTDATE" "+%a, %d %b %Y 13:00:00 +0000")

              # Build the new feed item
              NEW_ITEM="    <item>
      <title><![CDATA[$TITLE]]></title>
      <link>$URL</link>
      <guid isPermaLink=\"true\">$URL</guid>
      <description><![CDATA[$DESCRIPTION]]></description>
      <pubDate>$PUB_DATE</pubDate>
      <enclosure url=\"$IMAGE\" type=\"image/jpeg\" length=\"0\"/>
    </item>"

              # Check if this URL is already in feed.xml (avoid duplicates)
              if grep -qF "$URL" feed.xml; then
                echo "  Already in feed.xml, skipping: $URL"
              else
                # Insert the new item right after the opening <channel> + header tags
                # We insert before the first existing <item> tag
                python3 - <<PYEOF
import re

with open('feed.xml', 'r') as f:
    content = f.read()

new_item = """$NEW_ITEM"""

# Insert before the first <item> tag
if '<item>' in content:
    content = content.replace('<item>', new_item + '\n\n    <item>', 1)
else:
    # No items yet — insert before </channel>
    content = content.replace('</channel>', new_item + '\n\n  </channel>')

with open('feed.xml', 'w') as f:
    f.write(content)

print("  feed.xml updated with new item.")
PYEOF
                PUBLISHED=1
              fi

              # Remove the scheduled post file now that feed.xml is updated
              rm "$FILE"
              echo "  Removed $FILE from _scheduled/"

            else
              echo "Not yet: $FILENAME publishes on $POSTDATE"
            fi
          done

          # ----------------------------------------------------------------
          # Step 2: Swap blog.html index if a scheduled version is due
          # Named: YYYY-MM-DD-blog.html in _scheduled/
          # ----------------------------------------------------------------
          LATEST_BLOG=""
          for FILE in blog/_scheduled/*-blog.html; do
            if [ ! -f "$FILE" ]; then continue; fi

            FILENAME=$(basename "$FILE")
            POSTDATE=$(echo "$FILENAME" | cut -c1-10)

            if ! echo "$POSTDATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              continue
            fi

            if [ "$POSTDATE" \<= "$TODAY" ]; then
              # Pick the most recent one (in case multiple are due)
              if [ -z "$LATEST_BLOG" ] || [ "$POSTDATE" \>= "$(echo $LATEST_BLOG | cut -c1-10)" ]; then
                LATEST_BLOG="$FILE"
              fi
            fi
          done

          if [ -n "$LATEST_BLOG" ]; then
            echo "Updating blog.html from $LATEST_BLOG"
            cp "$LATEST_BLOG" "blog.html"

            # Remove all due blog index files
            for FILE in blog/_scheduled/*-blog.html; do
              if [ ! -f "$FILE" ]; then continue; fi
              FILENAME=$(basename "$FILE")
              POSTDATE=$(echo "$FILENAME" | cut -c1-10)
              if echo "$POSTDATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' && [ "$POSTDATE" \<= "$TODAY" ]; then
                rm "$FILE"
                echo "  Removed $FILE from _scheduled/"
              fi
            done

            PUBLISHED=1
          fi

          # ----------------------------------------------------------------
          # Step 3: Commit and push if anything changed
          # ----------------------------------------------------------------
          if [ "$PUBLISHED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled blog post(s) for $TODAY"
            git push
            echo "Done. Published for $TODAY."
          else
            echo "Nothing to publish today."
          fi
