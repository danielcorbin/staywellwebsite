name: Publish Scheduled Blog Posts

on:
  schedule:
    # Runs at 8:00 AM Eastern every day (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Publish due posts
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PUBLISHED=0

          # Check for any scheduled post whose date has arrived
          for FILE in blog/_scheduled/*.html; do
            if [ ! -f "$FILE" ]; then
              continue
            fi

            FILENAME=$(basename "$FILE")

            # Skip the reserved blog.html index file
            if [ "$FILENAME" = "blog.html" ]; then
              continue
            fi

            # Expect filename format: YYYY-MM-DD-slug.html
            POSTDATE=$(echo "$FILENAME" | cut -c1-10)

            # Validate it looks like a date
            if ! echo "$POSTDATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Skipping $FILENAME (no valid date prefix)"
              continue
            fi

            if [ "$POSTDATE" \<= "$TODAY" ]; then
              SLUG=$(echo "$FILENAME" | cut -c12-)
              echo "Publishing $FILENAME as blog/$SLUG"
              mv "$FILE" "blog/$SLUG"
              PUBLISHED=1
            else
              echo "Not yet: $FILENAME publishes on $POSTDATE"
            fi
          done

          # Update blog.html if a scheduled version exists
          if [ -f "blog/_scheduled/blog.html" ]; then
            echo "Updating blog.html from scheduled version"
            cp "blog/_scheduled/blog.html" "blog.html"
            rm "blog/_scheduled/blog.html"
            PUBLISHED=1
          fi

          if [ "$PUBLISHED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled blog post(s) for $TODAY"
            git push
            echo "Done. Post(s) published."
          else
            echo "Nothing to publish today."
          fi
